<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="description" content="TMM · 문제가 많은 게 문제 — 계산기처럼 사칙연산 문제를 만들어 A4로 인쇄하는 무료 문제지 생성기">
 <title>문제가 많은 게 문제 | TMM</title>
 <link rel="stylesheet" href="./styles.css">
</head>
<body>
 <main class="site">
  <header class="header">
   <button id="menuOpen" class="menu-trigger" type="button" aria-label="문제 유형 메뉴 열기"><span class="hamburger">☰</span><span class="menu-label">메뉴</span></button>
   <h1><a class="brand-text" href="./index.html">문제가 많은 게 문제</a></h1>
   <span class="header-note">TMM · DEMO</span>
  </header>
  <section class="builder" aria-label="문제 생성용 계산기">
   <div class="builder-left">
    <div id="expression" class="expression" aria-live="polite">세 자리 수 + 두 자리 수</div>
    <div class="key-row numbers" aria-label="자릿수 버튼">
     <button class="key" data-digit="1" type="button">한 자리 수</button>
     <button class="key" data-digit="2" type="button">두 자리 수</button>
     <button class="key" data-digit="3" type="button">세 자리 수</button>
     <button class="key" data-digit="4" type="button">네 자리 수</button>
    </div>
    <div class="key-row operators" aria-label="연산 기호 버튼">
     <button class="key operator" data-op="p" type="button">+</button>
     <button class="key operator" data-op="m" type="button">−</button>
     <button class="key operator" data-op="x" type="button">×</button>
     <button class="key operator" data-op="d" type="button">÷</button>
    </div>
    <div class="key-row actions">
     <button id="generate" class="key primary" type="button">문제 생성</button>
     <button id="backspace" class="key" type="button">뒤로</button>
     <button id="clear" class="key" type="button">전체 지우기</button>
    </div>
   </div>
   <div class="builder-right">
    <label for="count">문제 수</label>
    <input id="count" type="number" min="1" max="200" step="1" value="20" inputmode="numeric">
    <p class="caption">한 장에 2열 × 10문제<br>21문제부터 다음 장에 배치됩니다.</p>
   </div>
  </section>
  <div id="status" class="alert" role="status" aria-live="polite" hidden></div>
  <section class="preview" aria-labelledby="previewTitle">
   <div class="preview-heading">
    <h2 id="previewTitle">문제지 미리보기</h2>
    <div class="preview-tools">
     <button class="tool" type="button" id="openAnswers">정답지 열기 ↗</button>
     <button class="tool" type="button" id="printProblems">문제지 인쇄 / PDF</button>
    </div>
   </div>
   <div id="sheets" class="papers"></div>
  </section>
 </main>
 <div id="drawerBg" class="drawer-bg" hidden></div>
 <aside id="drawer" class="drawer" hidden aria-label="문제 유형 메뉴">
  <div class="drawer-top"><strong>문제 유형</strong><button id="menuClose" type="button" aria-label="메뉴 닫기">×</button></div>
  <nav>
   <button type="button" data-menu="basic">기본 사칙연산</button>
   <button type="button" data-menu="advanced">응용 사칙연산<small>추후 개발 예정</small></button>
   <button type="button" data-menu="decimal">소수의 사칙연산<small>추후 개발 예정</small></button>
   <button type="button" data-menu="fraction">분수의 사칙연산<small>추후 개발 예정</small></button>
  </nav>
  <p id="menuNotice" class="drawer-help">현재 데모에서는 기본 사칙연산만 이용할 수 있습니다.</p>
 </aside>
 <div id="printMount" aria-hidden="true"></div>
 <script src="./qr.js"></script>
 <script src="./generator.js"></script>
 <script src="./main.js"></script>
</body>
</html>
